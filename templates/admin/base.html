<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}管理画面{% endblock %}｜TOP QUEEN</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body>
{% if g.admin %}
<header class="a-header">
  <a href="{{ url_for('admin.dashboard') }}" class="a-logo">♛ TOP QUEEN <small>管理画面</small></a>
  <nav class="a-nav">
    <a href="{{ url_for('admin.shop') }}" class="{{ 'on' if request.endpoint == 'admin.shop' }}">店舗情報</a>
    <a href="{{ url_for('admin.prices') }}" class="{{ 'on' if request.endpoint and request.endpoint.startswith('admin.price') }}">料金</a>
    <a href="{{ url_for('admin.casts') }}" class="{{ 'on' if request.endpoint and request.endpoint.startswith('admin.cast') }}">キャスト</a>
    <a href="{{ url_for('admin.events') }}" class="{{ 'on' if request.endpoint and request.endpoint.startswith('admin.event') }}">イベント</a>
    <a href="{{ url_for('admin.accounts') }}" class="{{ 'on' if request.endpoint == 'admin.accounts' }}">アカウント</a>
    <a href="{{ url_for('index') }}" target="_blank">サイトを見る ↗</a>
    <form method="post" action="{{ url_for('admin.logout') }}" class="inline">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <button class="link">ログアウト</button>
    </form>
  </nav>
</header>
{% endif %}
<main class="a-main">
  {% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="flash">{{ m }}</div>{% endfor %}{% endwith %}
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
