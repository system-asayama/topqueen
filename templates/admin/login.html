{% extends "admin/base.html" %}
{% block title %}ログイン{% endblock %}
{% block content %}
<div class="auth">
  <h1>♛ TOP QUEEN<small>管理画面ログイン</small></h1>
  <form method="post" class="card">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>ユーザー名<input name="username" required autofocus autocomplete="username"></label>
    <label>パスワード<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="btn">ログイン</button>
  </form>
</div>
{% endblock %}
